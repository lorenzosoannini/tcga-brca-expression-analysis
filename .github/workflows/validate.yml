name: Check archived results
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check integrity and consistency of the existing exam results
        run: python3 scripts/verify_results.py
